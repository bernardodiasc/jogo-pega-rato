<!DOCTYPE html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1b2440" />
    <title>JOGO PEGA RATO</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <h1>JOGO PEGA RATO</h1>
      <div id="pontuacao"></div>
      <div id="mensagem"></div>
      <div id="tabuleiro"></div>
      <button id="reiniciar" type="button">Reiniciar</button>
      <p id="info">
        <b>Objetivo:</b> pegue todos os ratos.
        A cada 3 movimentos, um novo rato aparece.<br />
        <b>Como jogar:</b> setas ou WASD, clique/toque na casa vizinha,
        ou arraste no tabuleiro. Espaço reinicia.
      </p>
    </main>

    <script src="script.js"></script>
  </body>

</html>
